name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Home Assistant Hassfest
        uses: home-assistant/actions/hassfest@master

      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration
          ignore: [ "brands" ]
